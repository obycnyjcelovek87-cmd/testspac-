const isMap=v=>!!v&&typeof v==='object'&&!Array.isArray(v)&&!('answer' in v)&&!('options' in v)&&!('questions' in v);
function pickLang(v,l=lang){if(v==null)return '';if(isMap(v))return v[l]??v.ru??v.kg??Object.values(v).find(x=>typeof x==='string')??'';return v}
function gatherTexts(v){if(v==null)return [];if(typeof v==='string')return [v];if(Array.isArray(v))return v.flatMap(gatherTexts);if(isMap(v))return Object.values(v).flatMap(gatherTexts);if(typeof v==='object'){let out=[];if('title' in v)out.push(...gatherTexts(v.title));if('description' in v)out.push(...gatherTexts(v.description));if('text' in v)out.push(...gatherTexts(v.text));if('options' in v)out.push(...gatherTexts(v.options));if('explanation' in v)out.push(...gatherTexts(v.explanation));if(Array.isArray(v.questions))out.push(...v.questions.flatMap(gatherTexts));return out}return [String(v)]}
function availableTestLangs(a){let langs=Array.isArray(a?.langs)?[...a.langs]:[];const probe=v=>{if(isMap(v)){for(const k of Object.keys(v))if((k==='ru'||k==='kg')&&v[k])langs.push(k)}else if(Array.isArray(v))v.forEach(probe);else if(v&&typeof v==='object'){if('title' in v)probe(v.title);if('description' in v)probe(v.description);if('text' in v)probe(v.text);if('options' in v)probe(v.options);if('explanation' in v)probe(v.explanation);if(Array.isArray(v.questions))v.questions.forEach(probe)}};probe(a);langs=[...new Set(langs.filter(x=>x==='ru'||x==='kg'))];return langs.length?langs:['ru']}
function preferredTestLang(a,fallback=lang){const langs=availableTestLangs(a);if(session?.quizId===a.id&&session.contentLang&&langs.includes(session.contentLang))return session.contentLang;const pref=testLangPrefs[a.id];if(pref&&langs.includes(pref))return pref;if(langs.includes(fallback))return fallback;return langs[0]||'ru'}
function localizeQuestion(q,l){return {...q,text:pickLang(q.text,l),options:(q.options||[]).map(o=>pickLang(o,l)),explanation:pickLang(q.explanation,l)}}
function localizeTest(a,l=preferredTestLang(a)){return {...a,_contentLang:l,title:pickLang(a.title,l),description:pickLang(a.description,l),questions:(a.questions||[]).map(q=>localizeQuestion(q,l))}}

function testCard(a){const best=bestScore(a.id),resume=session?.quizId===a.id,langs=availableTestLangs(a),langNow=preferredTestLang(a),v=localizeTest(a,langNow);return `<article class="test-card"><div class="test-top"><div class="subject-icon ${subjectTone(a)}">${ic(subjectIcon(a),23)}</div><span class="test-tag">${html(categoryName(a.category))}</span></div><h3>${html(v.title)}</h3><p>${html(v.description||'')}</p>${langs.length>1?`<div class="test-lang-row"><span class="test-lang-label">${t('cardLang')}</span><div class="mini-lang-switch">${langs.map(code=>`<button class="mini-lang-btn ${langNow===code?'active':''}" type="button" data-set-testlang="${html(a.id)}" data-lang-value="${code}">${code.toUpperCase()}</button>`).join('')}</div></div>`:''}<div class="test-meta"><span>${ic('list',14)} ${a.questions.length} ${t('questions')}</span><span>${ic('clock',14)} ${Number(a.duration)>0?a.duration+' '+t('minutes'):t('unlimited')}</span></div><div class="test-card-footer"><button class="btn btn-primary btn-small" data-start="${html(a.id)}">${t(resume?'resume':'run')} ${ic('arrow',14)}</button>${best===null?`<span class="test-tag">${t('new')}</span>`:`<span class="best-score">${t('best')}: ${best}%</span>`}</div>${a.published?`<div class="published-notice">${ic('check',15)} ${lang==='kg'?'Бардыгы үчүн жеткиликтүү · 100 суроо':'Общий тест · 100 вопросов'}</div>`:''}${a.demo?'':`<div class="test-tools"><button class="link-btn" data-edit="${html(a.id)}">${ic('edit',14)} ${t('edit')}</button><button class="link-btn danger" data-delete="${html(a.id)}">${ic('trash',14)} ${t('delete')}</button></div>`}</article>`}
function statsHTML(){const count=results.length,avg=count?Math.round(results.reduce((a,r)=>a+r.percentage,0)/count):0,answered=results.reduce((a,r)=>a+(r.answered??r.total),0);return `<div class="stats"><div class="stat"><span class="stat-icon">${ic('list',23)}</span><div><strong>${count}</strong><small>${t('completed')}</small></div></div><div class="stat"><span class="stat-icon green">${ic('bar-chart',23)}</span><div><strong>${avg}%</strong><small>${t('average')}</small></div></div><div class="stat"><span class="stat-icon orange">${ic('check',23)}</span><div><strong>${answered}</strong><small>${t('answered')}</small></div></div></div>`}

async function pdfText(file){await loadExternal('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),items=(await page.getTextContent()).items;let prevY=null,prevX=null;for(const item of items){const y=item.transform?.[5]||0;const x=item.transform?.[4]||0;if(prevY!==null&&Math.abs(prevY-y)>3)text+='\n';else if(prevX!==null&&x-prevX>8)text+=' ';text+=item.str;prevY=y;prevX=x+(item.width||0);if(item.hasEOL){text+='\n';prevY=null;prevX=null}}text+='\n'}return text}
async function legacyDocText(file){await loadExternal('https://cdn.jsdelivr.net/gh/Alpaq92/JSDoc@main/src/docToText.js','docToText');const result=docToText(await file.arrayBuffer());if(!result)throw Error(t('noText'));return result}
async function plainText(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\uFEFF/,'')}catch{return new TextDecoder('windows-1251').decode(buf)}}
function rtfText(input){let str=input.replace(/\\par\b/g,'\n').replace(/\\line\b/g,'\n').replace(/\\tab\b/g,' ');str=str.replace(/\\u(-?\d+)\??/g,(_,n)=>String.fromCharCode((Number(n)+65536)%65536)).replace(/\\'([a-f\d]{2})/gi,(_,v)=>new TextDecoder('windows-1251').decode(Uint8Array.of(parseInt(v,16))));str=str.replace(/\{\\\*[^{}]*\}/g,'').replace(/\\[a-z]+-?\d* ?/gi,'').replace(/\\([{}\\])/g,'$1').replace(/[{}]/g,'');return str}
function answerIndex(source){if(source===null||source===undefined)return null;let s=String(source).trim().toUpperCase().replace(/[).,:؛\-\s]/g,'');if(['А','A','1'].includes(s))return 0;if(['Б','B','2'].includes(s))return 1;if(['В','V','C','3'].includes(s))return 2;if(['Г','G','D','4'].includes(s))return 3;return null}
function stripFormatting(s){return s.replace(/[\u200b-\u200d\ufeff]/g,'').replace(/\u00a0/g,' ').replace(/[ 	]+/g,' ').trim()}
function looksLikeQuestion(s){return /[?？]$/.test(s)||/^(?:что|кто|как|почему|когда|где|какой|какая|сколько|определите|укажите|выберите|чем|эмне|ким|кайсы|кандай|эмнеге|качан|канча|аныктаңыз|белгилеңиз|төмөнкүлөр)/i.test(s)}
function splitInlineChoices(line){let re=/(?:^|\s)([A-DАБВГа-г])\s*[).:]\s*/g,matches=[...line.matchAll(re)];if(matches.length<2)return [line];const segments=[];if(matches[0].index>0)segments.push(line.slice(0,matches[0].index).trim());matches.forEach((m,i)=>segments.push(m[1]+') '+line.slice(m.index+m[0].length,(matches[i+1]?.index??line.length)).trim()));return segments.filter(Boolean)}
function parseQuestions(text){let raw=String(text||'').replace(/\r\n?/g,'\n').replace(/\f/g,'\n').replace(/\u2028/g,'\n');let lines=raw.split('\n').flatMap(l=>splitInlineChoices(stripFormatting(l))).map(stripFormatting).filter(Boolean);let items=[],cur=null,answerMap=new Map();const questionRE=/^(?:(?:вопрос|суроо|question|тапшырма)\s*(?:№|#)?\s*(\d{1,4})\s*[.):\-–]?|(?:№\s*)?(\d{1,4})\s*[.)])\s*(.*)$/i;const optionRE=/^([A-DАБВГа-г])\s*[).:\-–]\s*(.+)$/i;const numericOptionRE=/^([1-4])\s*[).]\s*(.+)$/;const answerRE=/^(?:(?:туура\s*)?(?:жооп(?:тор)?у?|жообу)|правильн(?:ый|ые|ого)\s*ответ(?:ы|а)?|ответ(?:ы)?|correct\s*answer|answer|ключ)\s*[:=\-–]\s*([A-DАБВГа-г1-4])/i;
 function push(){if(cur){if(cur.options.length>=2&&cur.text.trim()){cur.options=cur.options.slice(0,4);while(cur.options.length<4)cur.options.push('');items.push(cur)}cur=null}}
 lines.forEach((line,at)=>{const keyMatch=line.match(/^\s*(\d{1,4})\s*[).:\-–]\s*([A-DАБВГа-г1-4])\s*$/i);if(keyMatch&&items.length&&!(cur?.options.length<4)){answerMap.set(Number(keyMatch[1]),answerIndex(keyMatch[2]));return}
 const a=line.match(answerRE);if(a){if(cur){cur.answer=answerIndex(a[1]);let tail=line.slice(a[0].length).trim();if(tail)cur.explanation=tail}else{let last=items[items.length-1];if(last&&last.answer===null)last.answer=answerIndex(a[1])}return}
 let opt=line.match(optionRE),numeric=line.match(numericOptionRE);const numericAsOption=Boolean(cur&&cur.options.length<4&&numeric&&!(/\?$/.test(numeric[2])&&cur.options.length===0));if(opt&&cur&&cur.options.length<4){let val=opt[2].replace(/\s*[✓✔*+]\s*$/,'').trim();let marked=/[✓✔*+]\s*$/.test(opt[2])||/^\+\s*/.test(val);val=val.replace(/^\+\s*/,'');const index=answerIndex(opt[1]);if(index!==null){while(cur.options.length<=index&&cur.options.length<4)cur.options.push('');cur.options[index]=val;if(marked)cur.answer=index;return}}
 if(numericAsOption){let val=numeric[2].replace(/\s*[✓✔*+]\s*$/,'').trim();let index=Number(numeric[1])-1,marked=/[✓✔*+]\s*$/.test(numeric[2]);while(cur.options.length<=index&&cur.options.length<4)cur.options.push('');cur.options[index]=val;if(marked)cur.answer=index;return}
 const qm=line.match(questionRE);if(qm){push();cur={number:Number(qm[1]||qm[2]),text:(qm[3]||'').trim(),options:[],answer:null,explanation:''};return}
 if(!cur){if(looksLikeQuestion(line)&&at<lines.length-4)cur={number:items.length+1,text:line,options:[],answer:null,explanation:''};return}
 if(cur.options.length===0){cur.text+=(cur.text?' ':'')+line;return}
 if(cur.options.length<=4){cur.options[cur.options.length-1]+=' '+line;return}});
 push();items.forEach((q,i)=>{if(q.answer===null&&answerMap.has(q.number))q.answer=answerMap.get(q.number);q.text=q.text.trim();q.options=q.options.map(o=>o.trim())});return items.filter(q=>q.text&&q.options.length===4&&q.options.every(Boolean)).slice(0,600)}
function importJsonValue(value,name){const input=Array.isArray(value)?value:Array.isArray(value.tests)?value.tests:[value];return input.map((test,i)=>{if(!test||!Array.isArray(test.questions))throw Error(t('uploadBad'));let qs=test.questions.map(x=>({text:String(x.text??x.question??'').trim(),options:x.options||[],answer:x.answer===null||x.answer===undefined?NaN:Number(x.answer),explanation:String(x.explanation||'')}));if(qs.some(x=>!x.text||x.options.length!==4||x.options.some(o=>typeof o!=='string'||!o.trim())||!Number.isInteger(x.answer)||x.answer<0||x.answer>3))throw Error(t('uploadBad'));return {id:makeId()+'-'+i,title:String(test.title||name||'Тест'),category:String(test.category||'Общее'),description:String(test.description||''),duration:Number.isInteger(+test.duration)&&+test.duration>=0&&+test.duration<=240?+test.duration:15,questions:qs}})}
async function handleFile(file){if(!file)return;if(file.size>15*1024*1024){toast(t('tooLarge'));return}const ext=file.name.split('.').pop().toLowerCase();if(!['doc','docx','pdf','txt','rtf','json'].includes(ext)){toast(t('unsupported'));return}importStatus(t('reading')+' '+file.name);try{let content;if(ext==='json'){const tests=importJsonValue(JSON.parse(await plainText(file)),file.name.replace(/\.json$/i,''));customTests.push(...tests);saveTests();category='all';search='';view='catalog';render();toast(t('importSuccess')+' · '+tests.length);return}if(ext==='docx')content=await docxText(file);else if(ext==='pdf')content=await pdfText(file);else if(ext==='doc')content=await legacyDocText(file);else if(ext==='rtf')content=rtfText(await plainText(file));else content=await plainText(file);if(!content.trim())throw Error(t('noText'));const questions=parseQuestions(content);if(!questions.length)throw Error(t('uploadBad'));importDraft={title:file.name.replace(/\.(docx?|pdf|txt|rtf)$/i,'').replace(/[_-]/g,' '),category:'Общее',duration:15,description:'',questions,filename:file.name};view='preview';render();window.scrollTo({top:0,behavior:'instant'})}catch(err){importStatus(t('errorReading')+': '+(err?.message||String(err)));toast(t('errorReading')+': '+(err?.message||String(err)))}}
function renderPreview(){const d=importDraft;if(!d){navigate('import');return}const missing=d.questions.filter(q=>!Number.isInteger(q.answer)).length;app.innerHTML=`<div class="page-head"><div><div class="eyebrow">TESTSPACE IMPORT · ${html(d.filename)}</div><h1>${t('previewTitle')}</h1><p>${t('previewHint')}</p></div></div><div class="grid-two"><section class="surface"><div class="inline-controls" style="margin-bottom:20px"><span class="counter">${t('found')}: ${d.questions.length}</span>${missing?`<span class="counter warn">${t('needAnswers')}: ${missing}</span>`:''}</div><div class="field"><label for="previewTitle">${t('fileName')}</label><input id="previewTitle" value="${html(d.title)}" maxlength="150" required></div><div class="form-row"><div class="field"><label>${t('testCat')}</label><select id="previewCategory">${categoryOptions(d.category)}</select></div><div class="field"><label>${t('duration')}</label><input type="number" min="0" max="240" id="previewDuration" value="${d.duration}"><small>${t('noTime')}</small></div></div><div class="divider"></div><div class="preview-list">${d.questions.map((q,i)=>`<article class="preview-question ${Number.isInteger(q.answer)?'':'invalid'}" id="pq${i}"><div class="question-count">${t('question')} ${i+1}</div><h3 style="font-size:14px;white-space:pre-line;margin:9px 0">${html(q.text)}</h3><div class="options-preview">${q.options.map((o,j)=>`<span>${'ABCD'[j]}. ${html(o)}</span>`).join('')}</div><div class="field" style="margin:12px 0 0"><label for="pans${i}">${t('answerLabel')}</label><select class="preview-answer" data-pi="${i}" id="pans${i}"><option value="" ${q.answer===null?'selected':''}>${t('notSelected')}</option>${q.options.map((o,j)=>`<option value="${j}" ${j===q.answer?'selected':''}>${'ABCD'[j]} — ${html(o.slice(0,110))}</option>`).join('')}</select></div></article>`).join('')}</div><div class="divider"></div><div class="inline-controls"><button class="btn btn-primary" id="saveImport">${ic('check')} ${t('saveImported')}</button><button class="btn btn-ghost" id="cancelImport">${t('cancel')}</button></div></section><aside class="surface" style="align-self:start"><div class="callout-head"><div class="subject-icon">${ic('check')}</div><h3>${t('previewTitle')}</h3></div><p class="subtle">${t('previewHint')}</p>${missing?`<div class="notice warn">${t('missingAnswers')}</div>`:`<div class="notice">${t('found')}: ${d.questions.length}</div>`}<div class="divider"></div><button class="btn btn-ghost" id="backImport" style="width:100%">${ic('back')} ${t('import')}</button></aside></div>`;
 app.querySelectorAll('.preview-answer').forEach(sel=>sel.onchange=()=>{const i=Number(sel.dataset.pi);d.questions[i].answer=sel.value===''?null:Number(sel.value);document.getElementById('pq'+i).classList.toggle('invalid',d.questions[i].answer===null)});document.getElementById('cancelImport').onclick=()=>{importDraft=null;navigate('import')};document.getElementById('backImport').onclick=()=>{importDraft=null;navigate('import')};document.getElementById('saveImport').onclick=()=>{const missingIndex=d.questions.findIndex(q=>!Number.isInteger(q.answer));if(missingIndex>=0){toast(t('missingAnswers'));document.getElementById('pq'+missingIndex)?.scrollIntoView({behavior:'smooth',block:'center'});return}const title=document.getElementById('previewTitle').value.trim(),duration=Number(document.getElementById('previewDuration').value);if(!title){toast(t('required'));return}if(!Number.isInteger(duration)||duration<0||duration>240){toast(t('wrongDuration'));return}const a={id:makeId(),title:title.slice(0,150),category:document.getElementById('previewCategory').value,description:`${t('uploaded')}: ${d.filename}`.slice(0,500),duration,questions:d.questions.map(q=>({text:q.text,options:q.options,answer:q.answer,explanation:q.explanation||''}))};customTests.push(a);try{saveTests()}catch(err){customTests.pop();toast(err.message);return}importDraft=null;category='all';search='';view='catalog';render();toast(t('importSuccess'));setTimeout(()=>document.querySelector(`[data-start="${a.id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),80)} }
function init(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=ic(e.dataset.icon,e.dataset.icon==='logo'?25:19));document.querySelectorAll('[data-lang]').forEach(e=>e.onclick=()=>setLang(e.dataset.lang));document.getElementById('themeToggle').onclick=()=>setTheme(theme==='dark'?'light':'dark');document.getElementById('logo').onclick=e=>{e.preventDefault();navigate('home')};document.getElementById('mobileLogo').onclick=e=>{e.preventDefault();navigate('home')};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='create')editingId=null;navigate(b.dataset.view)});document.addEventListener('keydown',e=>{if(view!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;const a=session&&getTest(session.quizId);if(!a)return;if(/^[1-4]$/.test(e.key)&&Number(e.key)<=a.questions[session.index].options.length){session.answers[session.index]=Number(e.key)-1;saveSession();renderQuiz()}if(e.key==='ArrowLeft'&&session.index>0){session.index--;saveSession();renderQuiz()}if(e.key==='ArrowRight'&&session.index<a.questions.length-1){session.index++;saveSession();renderQuiz()}});if(session&&(!getTest(session.quizId)||!Array.isArray(session.answers)||session.answers.length!==getTest(session.quizId).questions.length||!Number.isInteger(session.index))){session=null;saveSession()}setTheme(theme);setLang(lang)}
